openapi: 3.2.0
info:
  contact: {}
  description: Flint AI Platform API
  license:
    name: Flint AI
    url: https://www.sandboxaq.com/legal/eula
  title: Flint AI Platform Aispm Models API
  version: 1.0.0
servers:
- description: Flint AI Platform (per-tenant instance)
  url: https://{instance}.flintai.dev/api/v1
  variables:
    instance:
      default: your-instance
      description: Your Flint AI instance subdomain
tags:
- name: aispm-models
paths:
  /aispm-models/tenants/{tenant_id}/workspaces/{workspace_id}:
    get:
      description: List all AI-SPM models for a tenant workspace, ordered by last_seen descending
      operationId: GetAllAispmModels
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/engine_output.EngineDataPage'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get all AI-SPM models
      tags:
      - aispm-models
  /aispm-models/tenants/{tenant_id}/workspaces/{workspace_id}/{id}:
    get:
      description: Get AI-SPM model by ID with embedded agents and locations
      operationId: GetAispmModelDetails
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
      - description: AISPM model Id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AispmModelDetailResponse'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get single AI-SPM model
      tags:
      - aispm-models
  /aispm-models/tenants/{tenant_id}/workspaces/{workspace_id}/{id}/{edge}:
    get:
      description: Get all 'edges' associated with an AISPM Model. An 'edge' is a type of object that is related to an AISPM Model.
      operationId: GetAISPMModelEdges
      parameters:
      - description: AISPM model Id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Edge type
        in: path
        name: edge
        required: true
        schema:
          enum:
          - assets
          - sessions
          - instances
          - issues
          - locations
          - garak-info
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/engine_output.EngineDataPage'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Failed to retrieve inventory
      security:
      - BearerAuth: []
      summary: Get all objects associated with an AISPM Model
      tags:
      - aispm-models
components:
  schemas:
    engine_output.EmbeddedLocationItem:
      properties:
        codeLocation:
          type: object
        id:
          type: string
      type: object
    engine_output.EngineDataPage:
      properties:
        cursor:
          type: string
        header:
          items:
            type: string
          type: array
        rows:
          items:
            items: {}
            type: array
          type: array
        total:
          type: integer
        total_sampling:
          type: number
      required:
      - cursor
      - header
      - rows
      type: object
    engine_output.EmbeddedSection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/engine_output.EmbeddedItem'
          type: array
        total:
          type: integer
      type: object
    api.AispmModelDetailResponse:
      properties:
        agents:
          $ref: '#/components/schemas/engine_output.EmbeddedSection'
        cursor:
          type: string
        header:
          items:
            type: string
          type: array
        locations:
          $ref: '#/components/schemas/engine_output.EmbeddedLocationSection'
        rows:
          items:
            items: {}
            type: array
          type: array
        total:
          type: integer
        total_sampling:
          type: number
      required:
      - cursor
      - header
      - rows
      type: object
    common.RequestError:
      description: Error responses returned by the API
      properties:
        code:
          example: 400
          type: integer
        message:
          example: Invalid request
          type: string
      required:
      - code
      - message
      type: object
    engine_output.EmbeddedItem:
      properties:
        id:
          type: string
        name:
          type: string
      type: object
    engine_output.EmbeddedLocationSection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/engine_output.EmbeddedLocationItem'
          type: array
        total:
          type: integer
      type: object
  securitySchemes:
    BearerAuth:
      description: Use this header with a Bearer token to authenticate requests.
      in: header
      name: Authorization
      type: apiKey
