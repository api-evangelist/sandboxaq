openapi: 3.2.0
info:
  contact: {}
  description: Flint AI Platform API
  license:
    name: Flint AI
    url: https://www.sandboxaq.com/legal/eula
  title: Flint AI Platform Aispm Agents API
  version: 1.0.0
servers:
- description: Flint AI Platform (per-tenant instance)
  url: https://{instance}.flintai.dev/api/v1
  variables:
    instance:
      default: your-instance
      description: Your Flint AI instance subdomain
tags:
- name: aispm-agents
paths:
  /aispm-agents/tenants/{tenant_id}/workspaces/{workspace_id}:
    get:
      description: List all AI-SPM agents for a tenant workspace, ordered by last_seen descending
      operationId: GetAllAispmAgents
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/engine_output.EngineDataPage'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get all AI-SPM agents
      tags:
      - aispm-agents
  /aispm-agents/tenants/{tenant_id}/workspaces/{workspace_id}/{id}:
    get:
      description: Get AI-SPM agent by ID with embedded models, MCP servers, tools, sub-agents, guardrails, and locations
      operationId: GetAispmAgentDetails
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
      - description: Workspace ID
        in: path
        name: workspace_id
        required: true
        schema:
          type: string
      - description: AISPM agent Id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.AispmDetailResponse'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get single AI-SPM agent
      tags:
      - aispm-agents
  /aispm-agents/tenants/{tenant_id}/workspaces/{workspace_id}/{id}/{edge}:
    get:
      description: Get all 'edges' associated with an AISPM Agent. An 'edge' is a type of object that is related to an AISPM Agent.
      operationId: GetAISPMAgentEdges
      parameters:
      - description: AISPM agent Id
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Edge type
        in: path
        name: edge
        required: true
        schema:
          enum:
          - assets
          - sessions
          - instances
          - issues
          - locations
          - aispm_tools
          - aispm_input_guardrails
          - aispm_output_guardrails
          - aispm_agent_dependencies
          - aispm_model_dependencies
          - aispm_mcp_server_dependencies
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/engine_output.EngineDataPage'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common.RequestError'
          description: Failed to retrieve inventory
      security:
      - BearerAuth: []
      summary: Get all objects associated with an AISPM Agent
      tags:
      - aispm-agents
components:
  schemas:
    engine_output.EmbeddedLocationItem:
      properties:
        codeLocation:
          type: object
        id:
          type: string
      type: object
    engine_output.EngineDataPage:
      properties:
        cursor:
          type: string
        header:
          items:
            type: string
          type: array
        rows:
          items:
            items: {}
            type: array
          type: array
        total:
          type: integer
        total_sampling:
          type: number
      required:
      - cursor
      - header
      - rows
      type: object
    cost.PeriodCost:
      properties:
        cost:
          type: number
        period:
          type: string
      type: object
    cost.CostHistory:
      properties:
        current_month:
          type: number
        current_quarter:
          type: number
        monthly:
          items:
            $ref: '#/components/schemas/cost.PeriodCost'
          type: array
        ytd:
          type: number
      type: object
    engine_output.EmbeddedSection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/engine_output.EmbeddedItem'
          type: array
        total:
          type: integer
      type: object
    common.RequestError:
      description: Error responses returned by the API
      properties:
        code:
          example: 400
          type: integer
        message:
          example: Invalid request
          type: string
      required:
      - code
      - message
      type: object
    cost.BurnRate:
      properties:
        daily_spend_rate:
          type: number
        status:
          type: string
      type: object
    engine_output.EmbeddedItem:
      properties:
        id:
          type: string
        name:
          type: string
      type: object
    cost.PeriodCostPerSession:
      properties:
        cost_per_session:
          type: number
        period:
          type: string
      type: object
    engine_output.EmbeddedLocationSection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/engine_output.EmbeddedLocationItem'
          type: array
        total:
          type: integer
      type: object
    api.AispmDetailResponse:
      properties:
        burn_rate:
          $ref: '#/components/schemas/cost.BurnRate'
        cost_history:
          $ref: '#/components/schemas/cost.CostHistory'
        cost_per_session_history:
          items:
            $ref: '#/components/schemas/cost.PeriodCostPerSession'
          type: array
        cursor:
          type: string
        header:
          items:
            type: string
          type: array
        input_guardrails:
          $ref: '#/components/schemas/engine_output.EmbeddedSection'
        locations:
          $ref: '#/components/schemas/engine_output.EmbeddedLocationSection'
        mcp_servers:
          $ref: '#/components/schemas/engine_output.EmbeddedSection'
        models:
          $ref: '#/components/schemas/engine_output.EmbeddedSection'
        output_guardrails:
          $ref: '#/components/schemas/engine_output.EmbeddedSection'
        rows:
          items:
            items: {}
            type: array
          type: array
        sub_agents:
          $ref: '#/components/schemas/engine_output.EmbeddedSection'
        tools:
          $ref: '#/components/schemas/engine_output.EmbeddedSection'
        total:
          type: integer
        total_sampling:
          type: number
      required:
      - cursor
      - header
      - rows
      type: object
  securitySchemes:
    BearerAuth:
      description: Use this header with a Bearer token to authenticate requests.
      in: header
      name: Authorization
      type: apiKey
