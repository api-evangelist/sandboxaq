"""
Query objects from AQtive Guard.
"""
type Query {
  """
  Root object to query
  """
  node(id: ID!): Node
  """
  Logged in user
  """
  viewer: User!
  """
  List of the existing trace types.
  """
  traceTypes: [TraceType]
  """
  List of analyzer rules
  """
  analyzerRules(profileType: ProfileType!): [AnalyzerRule!]
  """
  Cap version
  """
  version: String
  """
  Current status of all RQ queues
  """
  queueStatus: QueueStatus!
}

type Mutation {
  """
  Analyze a trace with a given profile.
  """
  analyze(input: AnalyzeInput!): AnalyzePayload
  """
  Authorize Jira Integration configuration and receive a request token and secret
  """
  authorizeJiraIntegration(input: AuthorizeJiraIntegrationInput!): AuthorizeJiraIntegrationPayload
  """
  Cancel JIRA Export.
  """
  cancelJiraExport(input: CancelJiraExportInput!): CancelJiraExportPayload
  """
  Cancels the scheduled job to update the exceptions cache of a report
  """
  cancelReportExceptionsCacheUpdate(input: CancelReportExceptionsCacheUpdateInput!): CancelReportExceptionsCacheUpdatePayload
  """
  Scan hosts via CrowdStrike
  """
  cancelScan(input: CancelScanInput!): CancelScanPayload
  """
  Changes the password of the current user
  """
  changePassword(input: ChangePasswordInput!): ChangePasswordPayload
  """
  Test Jira Configuration for Export
  """
  checkJiraExport(input: CheckJiraExportInput!): CheckJiraExportPayload
  """
  Test Jira integration connection
  """
  checkJiraIntegration(input: CheckJiraIntegrationInput!): CheckJiraIntegrationPayload
  """
  Test Tanium Computer Group
  """
  checkTaniumComputerGroup(input: CheckTaniumComputerGroupInput!): CheckTaniumComputerGroupPayload
  """
  Test Tanium integration connection
  """
  checkTaniumIntegration(input: CheckTaniumIntegrationInput!): CheckTaniumIntegrationPayload
  """
  Test Venafi integration connection
  """
  checkVenafiIntegration(input: CheckVenafiIntegrationInput!): CheckVenafiIntegrationPayload
  """
  Create a new local user.
  """
  createLocalUser(input: CreateLocalUserInput!): CreateLocalUserPayload
  """
  Create a new project.
  """
  createProject(input: CreateProjectInput!): CreateProjectPayload
  """
  Creates an exception for a project
  """
  createProjectException(input: CreateProjectExceptionInput!): CreateProjectExceptionPayload
  """
  Create a new Slot.
  """
  createSlot(input: CreateSlotInput!): CreateSlotPayload
  """
  Generate form data and URL method for use in the trace stream upload request. The upload endpoint is
  a S3-like object storage service and the form data is just for one-time use.
  """
  createStreamUpload(input: CreateStreamUploadInput!): CreateStreamUploadPayload
  """
  Register a previously uploaded file as a trace in CAP.
  """
  createTrace(input: CreateTraceInput!): CreateTracePayload
  """
  Delete a project.
  """
  deleteProject(input: DeleteProjectInput!): DeleteProjectPayload
  """
  Delete a project exception.
  """
  deleteProjectException(input: DeleteProjectExceptionInput!): DeleteProjectExceptionPayload
  """
  Delete a report.
  """
  deleteReport(input: DeleteReportInput!): DeleteReportPayload
  """
  Delete a slot.
  """
  deleteSlot(input: DeleteSlotInput!): DeleteSlotPayload
  """
  Delete a trace.
  """
  deleteTrace(input: DeleteTraceInput!): DeleteTracePayload
  """
  Deletes a user
  """
  deleteUser(input: DeleteUserInput!): DeleteUserPayload
  """
  Finalize stream upload and start tracing generation.
  """
  finalizeStreamUpload(input: FinalizeStreamUploadInput!): FinalizeStreamUploadPayload
  """
  Generate bulk presigned part number urls for the stream upload.
  """
  generatePresignedPartUrls(input: GeneratePresignedPartUrlsInput!): GeneratePresignedPartUrlsPayload
  """
  Generate form data and URL method for use in the trace upload request. The upload endpoint is a
  S3-like object storage service and the form data is just for one-time use.
  """
  generateTraceUploadPost(input: GenerateTraceUploadPostInput!): GenerateTraceUploadPostPayload
  """
  Get certificate details from Venafi
  """
  getVenafiCertificateDetails(input: GetVenafiCertificateDetailsInput!): GetVenafiCertificateDetailsPayload
  """
  Exports a Instance to JIRA
  """
  jiraExportInstance(input: JiraExportInstanceInput!): JiraExportInstancePayload
  """
  Exports multiple instances to JIRA
  """
  jiraExportInstances(input: JiraExportInstancesInput!): JiraExportInstancesPayload
  """
  Check all the certificates in a report against the Venafi database, and retrieve Venafi GUIDs for
  those that are found.
  """
  populateVenafiGuids(input: PopulateVenafiGuidsInput!): PopulateVenafiGuidsPayload
  """
  Refresh last update at stream upload tracker by provided key.
  """
  refreshStreamUpload(input: RefreshStreamUploadInput!): RefreshStreamUploadPayload
  """
  Request Jira Integration access token and secret to finalize the integration connection
  """
  requestJiraIntegrationAccessToken(input: RequestJiraIntegrationAccessTokenInput!): RequestJiraIntegrationAccessTokenPayload
  """
  Resets the password of a user
  """
  resetUserPassword(input: ResetUserPasswordInput!): ResetUserPasswordPayload
  """
  Schedule a job to update the exceptions cache of a report
