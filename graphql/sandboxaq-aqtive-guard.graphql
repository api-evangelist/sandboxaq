type Certificate {
  """
  The ID of the object
  """
  id: ID!
  """
  Report in which the certificate was found
  """
  report: Report!
  serialNumber: String!
  subject: String!
  issuer: String!
  version: String
  fingerprint: String
  """
  GUID of the certificate within Venafi, if one was found
  """
  venafiGuid: String
  """
  PEM encoded representation of the certificate.
  """
  encoded: String
  instances(before: String, after: String, first: Int, last: Int): InstanceConnection
  publicKey: Key!
  isCa: Boolean
  isSelfSigned: Boolean
  """
  Start of the certificate validity period
  """
  notBefore: DateTime
  """
  End of the certificate validity period
  """
  notAfter: DateTime
  signatureAlgorithm: SignatureAlgorithmData
  """
  Corresponding certificate at the AQtive Guard organization level
  """
  organizationCertificate: OrganizationCertificate
  """
  Locations at which the certificate was found
  """
  locations(before: String, after: String, first: Int, last: Int): LocationConnection
  """
  Operations that were involved with this certificate
  """
  operations(keptByFilters: Boolean, filters: OperationsFilter, sorters: [OperationsSorter], before: String, after: String, first: Int, last: Int): OperationConnection
  extensions: [CertificateExtensionData]
  signature: String
}

type CertificateConnection {
  """
  Pagination data for this connection.
  """
  pageInfo: PageInfo!
  """
  Contains the nodes in this connection.
  """
  edges: [CertificateEdge]!
  totalCount: Int!
}

"""
A Relay edge containing a Certificate and its cursor.
