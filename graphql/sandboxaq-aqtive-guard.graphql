"""
enum OperatorEnum {
  """
  Provided subFilters will be organized in an `AND` expression where all of the conditions have to be
  True for the node to be selected. eg., *value_1 AND value_2*, only if both are correct, node will be
  selected
  """
  AND
  """
  Provided subFilters will be organized in an `OR` expression where at least one of the conditions
  have to be True for the node to be selected. eg., *value_1 OR value_2*, if either one is correct,
  node will be selected
  """
  OR
  """
  Provided subFilters will be negated and only the first value in `subFilters` will be considered.
  eg., *NOT value_1*, the result of `value_1` will be negated and used for the selection of a node. If
  `value_1` is False, it will become True and vice-versa.
  """
  NOT
}

