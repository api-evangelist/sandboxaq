type CiphersuiteInfo {
  """
  ID of the ciphersuite. May correspond to a ciphersuite standardized by IETF or to an unknown one. In
  the former case other 'CiphersuiteInfo' fields will be filled with extracted information, such as
  'name', 'recommended' and others. In the latter case, most fields will be 'null'.
  """
  nid: Int!
  """
  Name given by IETF to a recognized ciphersuite. ('TLS_AES_128_GCM_SHA256',
  'TLS_NULL_WITH_NULL_NULL', ...)
  """
  name: String
  """
  Whether ciphersuite is recommended by IETF or not.
  """
  recommended: Boolean!
  """
  List of RFCs in which ciphersuite was defined.
  """
  reference: [String]
  version: CiphersuiteTlsVersion!
  """
  Key exchange algorithm used. (ECDHE, DHE, RSA, ...)
  """
  kex: String @deprecated(reason: "Will be renamed to kexAlg in future releases.")
  """
  Authentication algorithm used. (ECDSA, RSA, PSK, ...)
  """
  auth: String @deprecated(reason: "Will be renamed to authAlg in future releases.")
  """
  Block/stream cipher algorithm used. (AES, RC4, ...)
  """
  algorithmSym: String @deprecated(reason: "Will be renamed to symmetricCipherAlg in future releases.")
  """
  MAC algorithm used. (AEAD for TLS1.3, SHA256, ...)
  """
  mac: String @deprecated(reason: "Will be renamed to macAlg in future releases.")
  """
  Mode of operation used by the block cipher. 'null' if stream cipher is used. (GCM, CBC, CCM, ...)
  """
  modeOfOperation: String @deprecated(reason: "Will be renamed to modeOfOperationAlg in future releases.")
  """
  Hash algorithm used; serves as HKDF for TLS1.3 and as a MAC for TLS1.2. (SHA-family, MD5, ...)
  """
  hashAlg: String
}

