"""
An enumeration.
"""
enum OperationEnum {
  """
  Applies `{field} CONTAINS {value}` operation. `CONTAINS` will check for string match in the field
  value. eg., `name` CONTAINS `desc` will select nodes that have word `desc` in their name.
  `createdAt` CONTAINS `2019` will select nodes that were created in theyear 2019.
  """
  CONTAINS
  """
  Applies `{field} EQUALS {value}` operation. `EQUALS` will check if the `value` is exactly the same
  to the field value. eg., `name` EQUALS `Project 1` will select node that has the exact name `Project
  1`. `createdAt` EQUALS `2019-10-17` will select nodes that were created on the17th Oct, 2019.
  """
  EQ
  """
  Applies `{field} NOT EQUALS {value}` operation. `NOT EQUALS` will check if the `value` is not the
  same to the field value. eg., `name` NOT EQUALS `Project 1` will select nodes that do not have the
  name `Project 1`. `createdAt` NOT EQUALS `2019-10-17` will select nodes that were not created on the
  17th Oct, 2019.
  """
  NEQ
  """
  Applies `{field} GREATER THAN {value}` operation. `GREATER THAN` will check if the `value` is
  greater than the field value. eg., `name` GREATER THAN `Project 1` will select nodes that have names
  alphabetically after `Project 1`, like `Project 2` or `The project`. `createdAt` GREATER THAN
  `2019-10-17` will select nodes that were created after 17th Oct, 2019.
  """
  GT
  """
  Applies `{field} GREATER OR EQUALS THAN {value}` operation. `GREATER OR EQUALS THAN` will check if
  the `value` is greater or equal to the field value. GE combines GT and EQ operations. eg., `name`
  GREATER OR EQUALS THAN `Project 1` will select nodes with names alphabetically after `Project 1`
  (like `Project 2` or `The project`) or have the name `Project 1`. `createdAt` GREATER OR EQUALS THAN
  `2019-10-17` will select nodes that were created on and after 17th Oct, 2019.
  """
  GE
  """
  Applies `{field} LESS THAN {value}` operation. `LESS THAN` will check if the `value` is lesser than
  the field value. eg., `name` LESS THAN `Project 1` will select nodes that have names alphabetically
  before `Project 1`, like `Project 0` or `My project`. `createdAt` LESS THAN `2019-10-17` will select
  nodes that were created before 17th Oct, 2019.
  """
  LT
  """
  Applies `{field} LESS OR EQUALS THAN {value}` operation. `LESS OR EQUALS THAN` will check if the
  `value` is lesser or equal to the field value. LE combines LT and EQ operations. eg., `name` LESS OR
  EQUALS THAN `Project 1` will select nodes with names alphabetically before `Project 1` (like
  `Project 0` or `My project`) or have the name `Project 1`. `createdAt` LESS OR EQUALS THAN
  `2019-10-17` will select nodes that were created on and before 17th Oct, 2019.
  """
  LE
}

