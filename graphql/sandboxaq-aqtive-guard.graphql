  """
  Update an existing CrowdStrike integration
  """
  updateCrowdStrikeIntegration(input: UpdateCrowdStrikeIntegrationInput!): UpdateCrowdStrikeIntegrationPayload
  """
  Unlink an existing CrowdStrike integration
  """
  unlinkCrowdStrikeIntegration(input: UnlinkCrowdStrikeIntegrationInput!): UnlinkCrowdStrikeIntegrationPayload
  """
  Check if CrowdStrike integration settings are valid
  """
  checkCrowdStrikeIntegration(input: CheckCrowdStrikeIntegrationInput!): CheckCrowdStrikeIntegrationPayload
  """
  Mutation to update ServiceNow integration settings for an organization. This mutation allows an
  authenticated user to update the ServiceNow settings or create a new one if they do not exist.
  Settings are tested against the ServiceNow instance to ensure correctness. Note: Inputs are
  validated with strict length validations because ServiceNow will accept any input and truncate it to
  the max allowed length.
  """
  updateServiceNowIntegration(input: UpdateServiceNowIntegrationInput!): UpdateServiceNowIntegrationPayload
  """
  Mutation to test ServiceNow integration settings. We support two cases: 1. Test settings provided as
  input: All settings provided as input will be tested against the ServiceNow instance. 2. Test
  existing settings: To test existing settings, they must exist in the database. The input password
  must be an empty string, and the instance_url and user_id must match the saved settings'
  instance_url and user_id.
  """
  checkServiceNowIntegration(input: CheckServiceNowIntegrationInput!): CheckServiceNowIntegrationPayload
  """
  Delete existing ServiceNow settings
  """
  unlinkServiceNowIntegration(input: UnlinkServiceNowIntegrationInput!): UnlinkServiceNowIntegrationPayload
  serviceNowExportReport(input: ServiceNowExportReportInput!): ServiceNowExportReportPayload
  """
  Export instance to ServiceNow
  """
  serviceNowExportInstance(input: ServiceNowExportSingleInstanceInput!): ServiceNowExportSingleInstancePayload
  """
  Cancels the running ServiceNow bulk export for the selected report. Note: There can be only one
  running export per report, which is why we are doing it through the report
  """
  serviceNowCancelReportExport(input: CancelServiceNowReportExportInput!): CancelServiceNowReportExportPayload
}

"""
Analyze a trace with a given profile.
"""
type AnalyzePayload {
  """
  The trace that was analyzed
  """
  trace: Trace!
  """
  The profile that was applied
  """
  profile: Profile!
  """
  The report that was generated
  """
  report: Report!
  clientMutationId: String
}

type AnalyzerRule {
  ruleset: Ruleset!
  category: RuleCategory!
  number: Int!
  title: String!
  compatibleTraceTypes: [CompatibleTraceType!]
  shortExplanation: String
  consequences: String
  explanation: String
  resources: String
  access: String
  expertise: String
  kbLink: [KbLink!]
}

"""
Authorize Jira Integration configuration and receive a request token and secret
"""
type AuthorizeJiraIntegrationPayload {
  jiraIntegration: JiraIntegration!
  clientMutationId: String
}

type BatchExport {
  """
  status.
  """
  exportType: ExportType!
  """
  status.
  """
  status: ExportStatus!
  """
  Total expected count of instances for export
  """
  totalCount: Int!
  """
  Number of exported instances in the current status of the export
  """
  exportedCount: Int!
  """
  Export creation time
  """
  createdAt: DateTime!
  """
  Export cancellation time
  """
  canceledAt: DateTime
}

"""
A single call to a cryptographic library from a traced application.
"""
type Call {
  """
  The ID of the object
  """
  id: ID!
  timestamp: Float
  arguments: String
  """
  Status of the call with regards to project exceptions
  """
  isKeptByFilters: Boolean!
  stackTrace(before: String, after: String, first: Int, last: Int): StackFrameConnection
}

type CallConnection {
  """
  Pagination data for this connection.
  """
  pageInfo: PageInfo!
  """
  Contains the nodes in this connection.
  """
  edges: [CallEdge]!
  totalCount: Int!
}

"""
A Relay edge containing a Call and its cursor.
"""
type CallEdge {
  """
  The item at the end of the edge
  """
  node: Call
  """
  A cursor for use in pagination
  """
  cursor: String!
}

type CallLimiting {
  """
  Indicates whether calls were discarded during the preparation of the report
  """
  callsLimited: Boolean
  """
  Maximum number of calls in a bucket, as set in the analyzer
  """
  maxCallsPerBucket: Int
  """
  Maximum number of calls in total, as set in the analyzer
  """
  maxCallsTotal: Int
  """
  Number of kept calls
  """
  numCallsKept: Int
  """
  Number of calls discarded because of the bucket limit
  """
  numCallsOverBucketLimit: Int
  """
  Number of calls discarded because of the total limit
  """
  numCallsOverTotalLimit: Int
  """
  Total number of calls
  """
  numCallsTotal: Int
  """
  Number of distinct buckets
  """
  numBuckets: Int
  """
  Number of buckets where the call limit was reached
  """
  numFullBuckets: Int
}

"""
A specific call site in a traced application. As an example, if the class Foo , found in the file
Foo.java , there is a method bar() . Inside that method, on line 123, a call is made to Bat.baz() .
This this case, the CallSite node will have the following values: The corresponding java code might
look like this:
"""
type CallSite {
  """
  The ID of the object
  """
  id: ID!
  reportId: Float!
  covered: Boolean
  starred: Boolean
  """
  Class holding the method that made the call
  """
  class: String
  """
  Method that made the call
  """
  method: String!
  """
  File containing the code of the method
  """
  file: String
  """
  Line within the file that made the call
  """
  line: Int!
  """
  Target class of the call
  """
  calledClass: String
  """
  Target method of the call
  """
  calledMethod: String
}

type CallSiteConnection {
  """
  Pagination data for this connection.
  """
  pageInfo: PageInfo!
  """
  Contains the nodes in this connection.
  """
  edges: [CallSiteEdge]!
  totalCount: Int!
}

"""
A Relay edge containing a CallSite and its cursor.
"""
type CallSiteEdge {
  """
  The item at the end of the edge
  """
  node: CallSite
  """
  A cursor for use in pagination
  """
  cursor: String!
}

