  """
  updateJiraIntegration(input: UpdateJiraIntegrationInput!): UpdateJiraIntegrationPayload
  """
  Update an existing Jira settings URL and generate public and private keys
  """
  updateJiraIntegrationUrl(input: UpdateJiraIntegrationUrlInput!): UpdateJiraIntegrationUrlPayload
  """
  Update an existing Jira settings
  """
  updateJiraIssueCollector(input: UpdateJiraIssueCollectorInput!): UpdateJiraIssueCollectorPayload
  """
  Update an already existing project
  """
  updateProject(input: UpdateProjectInput!): UpdateProjectPayload
  """
  Updates a project exception.
  """
  updateProjectException(input: UpdateProjectExceptionInput!): UpdateProjectExceptionPayload
  """
  Update a Project jira settings
  """
  updateProjectJiraIntegration(input: UpdateProjectJiraIntegrationInput!): UpdateProjectJiraIntegrationPayload
  """
  Update a Project jira issue collector settings
  """
  updateProjectJiraIssueCollector(input: UpdateProjectJiraIssueCollectorInput!): UpdateProjectJiraIssueCollectorPayload
  """
  Unlink Project level jira issue collector
  """
  unlinkProjectJiraIssueCollector(input: UnlinkProjectJiraIssueCollectorInput!): UnlinkProjectJiraIssueCollectorPayload
  """
  Unlink Project level Tanium integration and clean the configuration
  """
  unlinkProjectTanium(input: UnlinkProjectTaniumIntegrationInput!): UnlinkProjectTaniumIntegrationPayload
  """
  Update an already existing slot
  """
  updateSlot(input: UpdateSlotInput!): UpdateSlotPayload
  """
  Update an existing Tanium integration
  """
  updateTaniumIntegration(input: UpdateTaniumIntegrationInput!): UpdateTaniumIntegrationPayload
  """
  Unlink an existing Tanium integration
  """
  unlinkTaniumIntegration(input: UnlinkTaniumIntegrationInput!): UnlinkTaniumIntegrationPayload
  """
  Update an existing Tanium integration
  """
  updateProjectTanium(input: UpdateProjectTaniumInput!): UpdateProjectTaniumPayload
  """
  Updates an existing user
  """
  updateUser(input: UpdateUserInput!): UpdateUserPayload
  """
  Update an existing Venafi integration
  """
  updateVenafiIntegration(input: UpdateVenafiIntegrationInput!): UpdateVenafiIntegrationPayload
  """
  Unlink an existing Venafi integration
  """
  unlinkVenafiIntegration(input: UnlinkVenafiIntegrationInput!): UnlinkVenafiIntegrationPayload
  """
  Upload a certificate to Venafi For a detailed overview of available parameters visit:
  https://docs.venafi.com/Docs/current/TopNav/Content/SDK/WebSDK/r-SDK-POST-Certificates-Import.php
  """
  uploadCertificateToVenafi(input: UploadCertificateToVenafiInput!): UploadCertificateToVenafiPayload
  """
  Delete a profile.
  """
  deleteProfile(input: DeleteProfileInput!): DeleteProfilePayload
  """
  Create a new tracer Profile.
  """
  createTracerProfile(input: CreateTracerProfileInput!): CreateTracerProfilePayload
  """
  Create a new fuzzer Profile.
  """
  createFuzzerProfile(input: CreateFuzzerProfileInput!): CreateFuzzerProfilePayload
  """
  Update a tracer Profile.
  """
  updateTracerProfile(input: UpdateTracerProfileInput!): UpdateTracerProfilePayload
  """
  Update a fuzzer Profile.
  """
  updateFuzzerProfile(input: UpdateFuzzerProfileInput!): UpdateFuzzerProfilePayload
  """
  Create a report diff between two reports
  """
  createReportDiff(input: CreateReportDiffInput!): CreateReportDiffPayload
  """
  Query hosts via CrowdStrike For a detailed overview of available parameters visit (requires login):
  https://assets.falcon.us-2.crowdstrike.com/support/api/swagger-
  us2.html#/hosts/QueryDevicesByFilterScroll
  """
  queryHostsViaCrowdStrike(input: QueryHostsViaCrowdStrikeInput!): QueryHostsViaCrowdStrikePayload
  """
  Scan hosts via CrowdStrike
  """
