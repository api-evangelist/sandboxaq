- aid: sandboxaq:mcp-server
  name: SandboxAQ MCP Server
  description: 'A fully managed, per-tenant Model Context Protocol server that exposes SandboxAQ''s
    proprietary scientific AI models as callable tools inside Claude and other MCP clients. It carries
    the aqcat tool (dense adsorption energy screening powered by the AQCat25-EV2 machine-learning
    potential) and the four AQPotency tools (single-pair potency prediction, library screening, panel
    scanning and selectivity) built on a proteochemometric model. Transport is Streamable HTTP;
    authentication is OAuth only — no static API keys are issued or accepted.'
  humanURL: https://docs.aisim.sandboxaq.com/mcp
  baseURL: https://mcp.{tenant}.aisim.sandboxaq.com
