aid: sandboxaq
name: SandboxAQ
description: 'SandboxAQ (SB Technology, Inc.) builds Large Quantitative Models (LQMs) — AI systems that
  fuse physics, chemistry and proprietary scientific data — and ships them as commercial platforms with
  public developer surfaces. Three product lines carry callable APIs: AQtive Guard, a cryptography and
  non-human-identity posture-management platform (built on the Cryptosense analyzer) exposing a GraphQL
  API at /api/v2 plus a fleet of language and network sensors; Flint AI, an AI-agent security platform
  whose Platform API is a documented OpenAPI 3.0.3 contract over an inventory graph of agents, models,
  tools and MCP servers, paired with the flintai CLI and a Python guardrails SDK; and the SandboxAQ MCP
  Server, a per-tenant OAuth-protected Model Context Protocol endpoint that exposes the AQCat adsorption
  and AQPotency proteochemometric potency models as tools for LLM clients.'
