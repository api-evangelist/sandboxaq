apis:
- aid: sandboxaq:aqtive-guard-api
  name: AQtive Guard API
  description: >-
    AQtive Guard is SandboxAQ's cryptography and non-human-identity management platform, built on the
    Cryptosense analyzer it acquired. Its API is GraphQL, served at /api/v2 and authenticated with an
    API-KEY header. The published schema covers projects, traces, analysis reports, cryptographic instances,
    keys, certificates, ciphersuites, TLS and SSH handshakes, scans, rules, vulnerabilities and slots,
    plus mutations for the Jira, ServiceNow, CrowdStrike, Tanium and Venafi integrations. Sensors (Java,
    Python, .NET, OpenSSL and PKCS#11 tracers, filesystem and bytecode scanners, a network analyzer) feed
    traces into it, and the cs-api CLI wraps the upload-and-analyze flow.
  humanURL: https://aqtiveguard.sandboxaq.com/docs/api/
  baseURL: https://aqtiveguard.sandboxaq.com/api/v2
  tags:
  - Cryptography
  - Security
  - Post-Quantum Cryptography
  - Certificates
  - Non-Human Identity
  properties:
  - type: GraphQL
    url: graphql/sandboxaq-aqtive-guard.graphql
  - type: Documentation
    url: https://aqtiveguard.sandboxaq.com/docs/
  - type: APIReference
    url: https://aqtiveguard.sandboxaq.com/docs/api/reference/
  - type: GettingStarted
    url: https://aqtiveguard.sandboxaq.com/docs/getting-started/
  - type: ChangeLog
    url: https://aqtiveguard.sandboxaq.com/docs/changelog/
  - type: CLI
    url: cli/sandboxaq-cli.yml
- aid: sandboxaq:mcp-server
  name: SandboxAQ MCP Server
  description: >-
    A fully managed, per-tenant Model Context Protocol server that exposes SandboxAQ's proprietary scientific
    AI models as callable tools inside Claude and other MCP clients. It carries the aqcat tool (dense
    adsorption energy screening powered by the AQCat25-EV2 machine-learning potential) and the four AQPotency
    tools (single-pair potency prediction, library screening, panel scanning and selectivity) built on
    a proteochemometric model. Transport is Streamable HTTP; authentication is OAuth only — no static
    API keys are issued or accepted.
  humanURL: https://docs.aisim.sandboxaq.com/mcp
  baseURL: https://mcp.{tenant}.aisim.sandboxaq.com
  tags:
  - MCP
  - Agents
  - Simulation
  - Drug Discovery
  - Materials Science
  tags_raw:
  - Model Context Protocol
  - Agents
  - Simulation
  - Drug Discovery
  - Materials Science
