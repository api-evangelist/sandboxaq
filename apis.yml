apis:
- aid: sandboxaq:flint-ai-platform-api
  name: Flint AI Platform API
  description: 'The Flint AI Platform API gives programmatic access to everything the Flint AI Platform
    discovers about an organization''s AI estate: the agents found in code, the models, tools and MCP
    servers they use, the assets and locations behind them, and the issues and rules that apply. The
    inventory is modelled as a graph, and every entity exposes an edge endpoint so callers can traverse
    from an agent to its models, or from a model back to the agents that call it. Authentication is a
    bearer token created under Settings > API Keys; most paths are scoped to a tenant and a workspace.'
  humanURL: https://docs.flintai.dev/flintai/api-reference/index
  baseURL: https://your-instance.flintai.dev/api/v1
