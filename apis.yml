- aid: sandboxaq:aqtive-guard-api
  name: AQtive Guard API
  description: 'AQtive Guard is SandboxAQ''s cryptography and non-human-identity management platform,
    built on the Cryptosense analyzer it acquired. Its API is GraphQL, served at /api/v2 and authenticated
    with an API-KEY header. The published schema covers projects, traces, analysis reports, cryptographic
    instances, keys, certificates, ciphersuites, TLS and SSH handshakes, scans, rules, vulnerabilities and
    slots, plus mutations for the Jira, ServiceNow, CrowdStrike, Tanium and Venafi integrations. Sensors
    (Java, Python, .NET, OpenSSL and PKCS#11 tracers, filesystem and bytecode scanners, a network analyzer)
    feed traces into it, and the cs-api CLI wraps the upload-and-analyze flow.'
  humanURL: https://aqtiveguard.sandboxaq.com/docs/api/
  baseURL: https://aqtiveguard.sandboxaq.com/api/v2
  tags:
