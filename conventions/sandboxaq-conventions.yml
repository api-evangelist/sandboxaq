- surface: AQtive Guard API
  style: GraphQL over HTTPS
  spec: graphql/sandboxaq-aqtive-guard.graphql
  endpoint: https://aqtiveguard.sandboxaq.com/api/v2
  authentication:
    scheme: API key in a custom header
    header: API-KEY
    evidence: 'POST without the header returns HTTP 400 {"errors":["You must supply an `API-KEY` header
      in your request"]}'
    cli_env: CRYPTOSENSE_API_KEY
  versioning:
    scheme: uri-path
    current: v2
    product_versioning: 'The product itself uses calendar versioning YY.MM.PATCH (see changelog/).'
  pagination:
    style: Relay cursor connections
    request_args: [first, after, last, before]
    response_types: '*Connection / *Edge / PageInfo'
    evidence: 'The schema declares 30+ Connection types (CallConnection, CertificateConnection,
      InstanceConnection, KeyConnection, ProjectConnection, ...) each with edges and a PageInfo node.'
  filtering_and_sorting:
    style: typed filter and sorter input objects per collection
    inputs: 'Filter inputs (InstancesFilter, CertificatesFilter, ScansFilter, ...) and sorter inputs
      (InstancesSorter, CertificatesSorter, ...) with per-collection FilterFields/SorterFields enums and
      an OperatorEnum (EQ, CONTAINS, ...) plus OrderEnum.'
  mutation_convention:
    style: Relay input/payload
    note: 'Every mutation takes a single `input` argument of a dedicated *Input type and returns a
      dedicated *Payload type; inputs carry an optional clientMutationId.'
  error_envelope:
    style: GraphQL errors array
    example: '{"errors":["You must supply an `API-KEY` header in your request"]}'
    format: GraphQL (not RFC 9457)
  idempotency:
    supported: false
    evidence: No idempotency key or replay-safe mutation contract is declared in the schema or docs.
  deprecation:
    style: '@deprecated field directives'
    note: 'The published schema reference marks deprecated fields with a warning glyph and a migration
      note (e.g. Ciphersuite.kex -> "Will be renamed to kexAlg in future releases"). Transcribed as
      @deprecated(reason:) directives in the SDL.'
- surface: SandboxAQ MCP Server
  style: Model Context Protocol over Streamable HTTP
  spec: mcp/sandboxaq-mcp.yml
  endpoint: https://mcp.{tenant}.aisim.sandboxaq.com
  authentication:
    scheme: oauth2
    api_keys_accepted: false
    note: 'Email + password, Google social login, or enterprise SSO. SandboxAQ explicitly does not issue
      or accept static API keys for this surface.'
  async_convention:
    style: submit / poll / fetch
    steps:
    - Call the tool; it returns a job_id in 1-2 seconds with status pending.
    - Poll check_job_status until is_terminal is true (the response carries a recommended
      poll_after_seconds interval).
    - Call get_job_results to fetch the predictions list.
    terminal_flag: is_terminal
    progress_field: progress_message
  upload_convention:
    tools: [upload_files, upload_local_files]
    purpose_value: aqpotency_screen
    session_handle: upload_session_id
    formats: ['.smi', '.csv (case-sensitive SMILES column header)']
    max_bytes: 16777216
  rate_limits:
    concurrency: 15 parallel aqcat jobs
    backoff: '~10 seconds after a rate-limit error'
    retry_after_header: false
    retry_after_note: 'Rate-limit responses do NOT include a Retry-After header — clients must use a
      fixed backoff.'
    quotas: 'aqcat: 1 bulk / 1 adsorbate / 1 facet per request, 5 placements hard cap, 100 steps per
      placement and 500 total, 25,000 max response tokens. AqpotencyScreen: 10,000 SMILES per call.'
    over_cap_behaviour: rejected with a ToolError
  idempotency:
    supported: false
  error_envelope:
    style: MCP ToolError
  result_ordering:
    note: 'AqpotencyScreen predictions are sorted by potency_mean descending; AqpotencySelectivity
      off_targets are ordered lexicographically by UniProt accession, NOT by submission order.'
  correctness_guards:
    note: 'The docs call out two behaviours a client must handle: aqcat placements with is_relaxed=false
      may carry anomalously high energies and must be excluded from analysis, and an unsupported
      adsorbate may be SILENTLY substituted with a chemically similar supported one — callers must
      verify info.adsorbate in the response matches the input.'
