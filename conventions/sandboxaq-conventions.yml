  authentication:
    scheme: bearer token in the Authorization header
    header: 'Authorization: Bearer <token>'
    issuance: Settings > API Keys in the Platform console; the token is shown once at creation
    profile: authentication/sandboxaq-authentication.yml
  versioning:
    scheme: uri-path
    current: v1
    evidence: 'servers[0].url = https://{instance}.flintai.dev/api/v1'
  multi_tenancy:
    style: path-scoped
    parameters: [tenant_id, workspace_id]
    pattern: /{resource}/tenants/{tenant_id}/workspaces/{workspace_id}
    note: 'Requests only return resources inside the named tenant and workspace, and the token must have
      access to them. tenant_id appears on 30 operations, workspace_id on 24.'
  pagination:
    style: cursor
    request_params: [cursor, page_size]
    request_params_note: 'One operation uses the camelCase variant pageSize — an inconsistency in the
      published spec, not a second scheme.'
    response_envelope: engine_output.EngineDataPage
    response_fields: [cursor, header, rows, total, total_sampling]
    required_response_fields: [cursor, header, rows]
    shape_note: 'Collection responses are tabular rather than object-per-row: `header` carries the column
      names and `rows` carries arrays of values. Clients must zip header against each row.'
  filtering_and_sorting:
    params: [sort, sort_dir, group_by, start_time, end_time, agent_id, sensorType, cicdType]
    ilike_suffix: '__ilk'
    ilike_note: 'Case-insensitive name filters use a __ilk suffixed query parameter (e.g. name__ilk).'
  graph_traversal:
    pattern: 'GET /{resource}/tenants/{tenant_id}/workspaces/{workspace_id}/{id}/{edge}'
    entities: [aispm-agents, aispm-models, aispm-tools, aispm-mcp-servers, assets, locations]
    note: 'Every graph entity exposes an edge endpoint returning its related entities, so a caller walks
      the inventory graph one hop at a time.'
  error_envelope:
    schema: common.RequestError
    fields:
    - {name: code, type: integer, example: 400}
    - {name: message, type: string, example: Invalid request}
    format: custom JSON object (NOT RFC 9457 application/problem+json)
    catalog: errors/sandboxaq-problem-types.yml
  idempotency:
    supported: false
